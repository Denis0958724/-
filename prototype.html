<script>
'use strict';

/* ===================== Утиліти ===================== */
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function norm(s) { return String(s || '').toLowerCase().replace(/[’ʼ`]/g, "'"); }
// \b не працює з кирилицею, тому початок слова визначаємо через (?<!\p{L}) і прапорець u
function stemRe(stem, flags = 'giu') { return new RegExp('(?<!\\p{L})' + escRe(stem), flags); }
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = ms => { if (ms == null || isNaN(ms) || ms < 0) return '0:00'; const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const unique = arr => [...new Set(arr)];
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s);
const pad = n => String(n).padStart(2, '0');
// Дати рахуємо за місцевим часом (toISOString дає UTC і біля півночі зсуває дату на добу)
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localStamp = d => `${localDate(d)}-${pad(d.getHours())}-${pad(d.getMinutes())}`;
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = n => `${pad(Math.floor(n / 60))}:${pad(n % 60)}`;
function labelFor(dateStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, mo - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((dt - today) / 86400000);
  if (diff === 0) return 'Сьогодні';
  if (diff === 1) return 'Завтра';
  if (diff === -1) return 'Вчора';
  return dt.toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

/* ---------- Часові пояси (помилка 6) ----------
   Фахівець задає графік у своєму поясі. Слоти і бронювання зберігаються як точний момент (мс UTC),
   а кожен бачить їх у поясі свого пристрою. */
const VIEW_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch { return 'UTC'; } })();
const KYIV_TZ = (() => { try { new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Kyiv' }); return 'Europe/Kyiv'; } catch { return 'Europe/Kiev'; } })();
const _tzFmt = {};
function tzParts(ms, tz) {
  const f = _tzFmt[tz] || (_tzFmt[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
  const o = {}; for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second };
}
function tzOffsetMin(ms, tz) {
  const p = tzParts(ms, tz);
  return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000) / 60000);
}
// Година в поясі tz → точний момент. Друга ітерація потрібна біля переходу на літній час.
function zonedToUtc(y, mo, d, h, mi, tz) {
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  let at = guess - tzOffsetMin(guess, tz) * 60000;
  at = guess - tzOffsetMin(at, tz) * 60000;
  return at;
}
function utcLabel(tz, ms = Date.now()) {
  const o = tzOffsetMin(ms, tz), a = Math.abs(o);
  return `UTC${o < 0 ? '-' : '+'}${Math.floor(a / 60)}${a % 60 ? ':' + pad(a % 60) : ''}`;
}
const hhmm = at => { const d = new Date(at); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const whenText = at => `${labelFor(localDate(new Date(at)))}, ${hhmm(at)}`;
const expertTz = ex => (ex && ex.tz) || KYIV_TZ;

/* ===================== Довідники ===================== */
// Напрями з паспорта. AI визначає напрям за основами слів у вільному тексті.
const CATEGORIES = [
  { id: 'tax', name: 'Податки і облік', kw: ['подат', 'оподатк', 'фоп', 'облік', 'бухгалт', 'декларац', 'пдфо', 'єсв', 'рро', 'прро', 'звітн', 'пдв', 'акциз'] },
  { id: 'legal', name: 'Договори й юридичні питання', kw: ['догов', 'оренд', 'суд', 'позов', 'юрист', 'юридич', 'претенз', 'спадщ', 'нотар', 'адвокат', 'закон', 'неустойк', 'розірв', 'контрагент', 'довірен'] },
  { id: 'career', name: "Кар'єра і резюме", kw: ['резюме', 'співбесід', 'робот', "кар'єр", 'карєр', 'ваканс', 'зарплат', 'linkedin', 'звільн', 'рекрутер', 'офер', 'оффер', 'підвищен', 'роботодав', 'працевлашт'] },
  { id: 'strategy', name: 'Бізнес-стратегія', kw: ['стратег', 'бізнес-план', 'бізнес план', 'масштаб', 'інвестор', 'стартап', 'конкурент', 'ціноутвор', 'франшиз', 'юніт', 'партнер'] },
  { id: 'marketing', name: 'Маркетинг', kw: ['маркетинг', 'реклам', 'таргет', 'smm', 'інстаграм', 'instagram', 'бренд', 'просуван', 'лендинг', 'seo', 'контент', 'соцмереж'] },
  { id: 'tech', name: 'AI та технології', kw: ['штучн', 'нейромереж', 'chatgpt', 'gpt', 'автоматиз', 'програмуван', 'сайт', 'crm', 'python', 'застосунк', 'застосунок', 'ai'] },
  { id: 'finance', name: 'Фінансова грамотність', kw: ['заощадж', 'інвест', 'кредит', 'іпотек', 'депозит', 'пенсі', 'облігац', 'овдп', 'борг', 'накопич', 'бюджет сім', 'розстрочк'] },
  { id: 'education', name: 'Освіта і навчання за кордоном', kw: ['навчан', 'вступ', 'університет', 'магістр', 'бакалавр', 'грант', 'стипенд', 'ielts', 'toefl', 'мотиваційн', 'за кордон', 'школ'] },
];
const CAT = {};
for (const c of CATEGORIES) { c.res = c.kw.map(k => stemRe(k)); CAT[c.id] = c; }
const catName = id => (CAT[id] || {}).name || 'не визначено';

const LEVELS = { student: 'Студент-практик', practitioner: 'Практик', expert: 'Відомий фахівець' };
const LEVEL_PRICE = { student: [100, 250], practitioner: [250, 500], expert: [500, 1200] };
const levelFor = years => (+years < 2 ? 'student' : +years < 8 ? 'practitioner' : 'expert');
const COMMISSION = 0.2;
const URGENCY_LABEL = { today: 'Сьогодні, терміново', week: 'Протягом тижня' };
const RESOLVED = { yes: 'так', partly: 'частково', no: 'ні' };
const WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
const MOCK_TIMES = ['09:00', '09:30', '10:00', '11:15', '12:00', '13:30', '15:00', '16:45', '18:00', '19:30', '20:30', '21:15'];

// Демо-фахівці приходять із сервера разом з даними. Це вигадані профілі, тому позначка «демо-профіль», а не «✓ перевірено».
let MOCK_EXPERTS = [];
const SAMPLE_REVIEWS = [
  ['Чітко і по суті, за 15 хвилин розібрались.', 'Отримав конкретний план дій.'],
  ['Пояснила складне простими словами.', 'Трохи не вистачило часу, але підсумок допоміг.'],
  ['Дуже уважно вислухав ситуацію.', 'Відповідь була саме на моє питання.'],
];

/* ===================== Дані з сервера ===================== */
// Усі дані живуть на сервері. Браузер тримає лише те, що сервер дозволив бачити цьому користувачу,
// і кожну зміну відправляє запитом. Права перевіряє сервер.
const emptyDb = () => ({ users: [], experts: [], bookings: [], busy: [], subscriptions: [], outbox: [], mailEvents: [], demoExperts: [],
  currentUserId: null, expertDraft: null, expertSession: null, server: {} });
let db = emptyDb();
let serverOK = true;
const DRAFT_KEY = 'micro-consult-expert-draft-v2';
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch { return null; } }
function applyState(st) {
  const draft = db.expertDraft || loadDraft();
  db = { ...emptyDb(), ...st, expertDraft: draft };
  MOCK_EXPERTS = (st.demoExperts || []).map(e => ({ ...e, mock: true }));
  serverOK = true; showStorageWarn();
  return db;
}
// Запит до API. Помилка приходить як об'єкт з текстом для людини і, можливо, полем, до якого вона стосується.
async function api(path, body, extraHeaders) {
  let r;
  try {
    r = await fetch(path, body === undefined ? { credentials: 'same-origin' }
      : { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'mc', ...(extraHeaders || {}) }, body: JSON.stringify(body) });
  } catch {
    serverOK = false; showStorageWarn();
    throw { status: 0, error: "Немає зв'язку з сервером. Перевірте, що сервер запущено, і спробуйте ще раз." };
  }
  let data = {}; try { data = await r.json(); } catch { /* порожня відповідь */ }
  if (!r.ok) throw { status: r.status, ...data, error: data.error || 'Щось пішло не так. Спробуйте ще раз.' };
  return data;
}
async function loadState() { applyState(await api('/api/state')); }
// Локально лишається тільки чернетка анкети фахівця, і то без пароля
function commit() {
  try {
    if (db.expertDraft) { const { pass, passOk, ...rest } = db.expertDraft; localStorage.setItem(DRAFT_KEY, JSON.stringify(rest)); }
    else localStorage.removeItem(DRAFT_KEY);
  } catch { /* сховища немає: чернетка проживе до перезавантаження */ }
}
function showStorageWarn() { const w = document.getElementById('storageWarn'); if (w) w.hidden = serverOK; }
const me = () => db.users.find(u => u.id === db.currentUserId) || null;
const myExpertRecord = () => db.experts.find(e => e.id === db.currentUserId) || null;

/* ===================== Стан сценарію ===================== */
const freshFlow = () => ({ draft: null, text: '', clarifications: [], excluded: [], analysis: null, analysisKey: '', override: false, clarifyMode: null, expertId: null, slot: null, ui: { lvl: '', sort: 'match' }, waitlisted: false, preferredExpertId: null });
let flow = freshFlow();
// Поточна заявка переживає F5: тримаємо її у сховищі вкладки (sessionStorage).
// Запис прив'язаний до акаунта, тож після входу іншої людини чужа заявка не з'явиться.
const FLOW_KEY = 'micro-consult-flow-v1';
function saveFlow() {
  try { sessionStorage.setItem(FLOW_KEY, JSON.stringify({ user: db.currentUserId, flow })); } catch { /* у перегляді Claude сховища немає */ }
}
function loadFlow() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(FLOW_KEY) || 'null');
    if (!saved || !saved.flow || saved.user !== db.currentUserId) return null;
    return { ...freshFlow(), ...saved.flow };
  } catch { return null; }
}
flow = loadFlow() || flow;
window.addEventListener('pagehide', saveFlow);
const mySub = cat => { const u = me(); return u && (db.subscriptions || []).find(x => x.userId === u.id && x.cat === cat); };
const fullText = () => [flow.text, ...flow.clarifications].filter(Boolean).join('\n');

const log = () => {};
let current = null, screenEnteredAt = Date.now(), screenInterval = null, renderToken = 0;
let pendingNotice = null, navByApp = false;

function setErr(id, msg, field) {
  const el = document.getElementById(id);
  if (el) el.textContent = msg || '';
  if (field) field.setAttribute('aria-invalid', msg ? 'true' : 'false');
}
function fail(errs, first, ctx = '') {
  const f = first.find(Boolean);
  if (f) f.focus();
}

/* ===================== AI-аналіз =====================
   Тему запиту, уточнення, найближчі теми і ранжування фахівців рахує власна модель на сервері (server/ai).
   Браузер лише показує результат. */
// Смайли не рахуються як текст. Слово: дві і більше літер, без трьох однакових підряд («ауууу» не слово). Сервер перевіряє так само.
const noEmoji = t => String(t).replace(/[\p{Extended_Pictographic}\p{Emoji_Modifier}\u200d\ufe0f]/gu, ' ').replace(/\s+/g, ' ').trim();
const realWords = t => (noEmoji(t).toLowerCase().match(/\p{L}{2,}/gu) || []).filter(w => !/(\p{L})\1\1/u.test(w));

/* ===================== Фахівці, слоти, підбір ===================== */
const stemOf = w => (w.length > 5 ? w.slice(0, w.length - 2) : w);
function regToPublic(rec) {
  return {
    id: rec.id, name: rec.name, cat: rec.cat, level: rec.level, rating: rec.rating || null, reviews: rec.reviews || 0, price: rec.price, test: !!rec.test,
    position: rec.position, bio: trunc(rec.about, 200), focus: rec.tags.map(w => [stemOf(w), w]),
    days: rec.days, from: rec.from, to: rec.to, mock: false, verified: rec.status === 'approved', status: rec.status,
  };
}
const allExperts = () => [...MOCK_EXPERTS, ...db.experts.filter(e => ['approved', 'auto_approved'].includes(e.status)).map(regToPublic)];
function findExpert(id) {
  const m = MOCK_EXPERTS.find(e => e.id === id); if (m) return m;
  const r = db.experts.find(e => e.id === id); return r ? regToPublic(r) : null;
}
const isBookedAt = (exId, at) => (db.busy || []).some(b => b.expertId === exId && b.at === at) || db.bookings.some(b => b.expertId === exId && b.at === at);
// Слоти фахівця на найближчі дні. Рахуємо в його поясі, групуємо за датою глядача.
function slotsFor(ex) {
  const tz = expertTz(ex), now = Date.now(), today = tzParts(now, tz);
  const horizon = ex.mock ? 3 : 7, all = [];
  for (let d = 0; d < horizon; d++) {
    const base = new Date(Date.UTC(today.y, today.m - 1, today.d + d)); // календарна дата фахівця
    const y = base.getUTCFullYear(), mo = base.getUTCMonth() + 1, da = base.getUTCDate(), wd = (base.getUTCDay() + 6) % 7; // Пн = 0
    let times;
    if (ex.mock) {
      const seed = parseInt(ex.id.slice(1), 10);
      times = MOCK_TIMES.filter((t, i) => (i + seed + d * 2) % 3 === 0);
    } else {
      times = [];
      if (ex.days.includes(wd)) for (let t = toMin(ex.from); t + 15 <= toMin(ex.to); t += 60) times.push(fromMin(t));
    }
    for (const t of times) {
      const [h, mi] = t.split(':').map(Number);
      const at = zonedToUtc(y, mo, da, h, mi, tz);
      if (at > now + 30 * 60000 && !isBookedAt(ex.id, at)) all.push(at);
    }
  }
  all.sort((a, b) => a - b);
  const todayLocal = new Date(localDate(new Date()) + 'T00:00');
  const days = [];
  for (const at of all) {
    const ds = localDate(new Date(at));
    let g = days.find(x => x.date === ds);
    if (!g) days.push(g = { date: ds, label: labelFor(ds), d: Math.round((new Date(ds + 'T00:00') - todayLocal) / 86400000), slots: [] });
    g.slots.push({ at, time: hhmm(at) });
  }
  return days;
}
const nextSlot = ex => { for (const g of slotsFor(ex)) if (g.slots.length) return { d: g.d, date: g.date, label: g.label, time: g.slots[0].time, at: g.slots[0].at }; return null; };

function scoreExpert(ex, a, text) {
  const reasons = [];
  // Основа: оцінка моделі (ймовірність теми фахівця і схожість його опису на запит)
  const rk = (a.ranking || []).find(x => x.id === ex.id);
  let s = rk ? 15 + rk.score * 0.75 : ex.cat === a.primary ? 60 : 15;
  if (ex.cat === a.primary) reasons.push({ ok: true, text: `Працює з темою «${catName(ex.cat)}»` });
  else if (ex.cat === a.secondary) reasons.push({ ok: true, text: `Суміжна тема: «${catName(ex.cat)}»` });
  else reasons.push({ ok: false, text: `Інша тема: «${catName(ex.cat)}»` });
  if (rk && rk.why.length) reasons.push({ ok: true, text: `Опис фахівця перегукується з вашим запитом: ${rk.why.join(', ')}` });
  const t = norm(text);
  const hits = unique(ex.focus.filter(([stem]) => stemRe(stem, 'iu').test(t)).map(([, label]) => label));
  if (hits.length) { s += Math.min(12, hits.length * 4); reasons.push({ ok: true, text: `Спеціалізація збігається: ${hits.join(', ')}` }); }
  const ns = nextSlot(ex);
  if (a.urgency === 'today') {
    if (ns && ns.d === 0) { s += 6; reasons.push({ ok: true, text: 'Є вільний час сьогодні' }); }
    else { s -= 4; reasons.push({ ok: false, text: 'Сьогодні вільного часу немає' }); }
  }
  if (a.budget) {
    if (ex.price <= a.budget) { s += 6; reasons.push({ ok: true, text: `Ціна в межах бюджету (до ${a.budget} грн)` }); }
    else { s -= 15; reasons.push({ ok: false, text: `Дорожче за ваш бюджет на ${ex.price - a.budget} грн` }); }
  }
  if (ex.id === flow.preferredExpertId) { s += 25; reasons.unshift({ ok: true, text: 'Ви обрали на головній' }); }
  if (ex.rating >= 4.8) { s += 4; reasons.push({ ok: true, text: 'Високий рейтинг' }); }
  else if (ex.rating) s += (ex.rating - 4) * 4;
  return { match: Math.max(5, Math.min(98, Math.round(s))), reasons, nextSlot: ns };
}
function rankExperts(a) {
  return allExperts()
    .filter(ex => ex.id !== db.currentUserId && ex.id !== (me() || {}).expertId && (ex.cat === a.primary || ex.cat === a.secondary || (a.nearest || []).some(n => n.cat === ex.cat) || ex.id === flow.preferredExpertId))
    .map(ex => ({ ex, ...scoreExpert(ex, a, fullText()) }));
}

const ROUTES = [
  ['home', /^\/?$/], ['profile', /^\/(?:profile|signup)$/], ['login', /^\/login$/], ['ask', /^\/ask$/], ['analysis', /^\/analysis$/],
  ['expert', /^\/expert\/([\w-]+)$/], ['pay', /^\/pay$/], ['booked', /^\/booked\/([\w-]+)$/], ['session', /^\/session\/([\w-]+)$/],
  ['summary', /^\/summary\/([\w-]+)$/], ['thanks', /^\/thanks\/([\w-]+)$/], ['cabinet', /^\/cabinet$/], ['mail', /^\/mail$/], ['consult', /^\/consult\/([\w-]+)$/], ['sub', /^\/sub\/([\w-]+)$/],
  ['becomeExpert', /^\/become-expert$/], ['expertSent', /^\/expert-sent$/],

// Маршрут живе в адресі (#/…). Якщо середовище не дає змінити адресу (деякі вбудовані перегляди),
// перемикаємось на маршрут у пам'яті. Сторінки при цьому працюють так само.
let memRoute = null;
const currentPath = () => (memRoute !== null ? memRoute : (location.hash.replace(/^#/, '') || '/'));
function setAddress(path, replace) {
  if (memRoute === null) {
    const target = '#' + path;
    if (location.hash === target) { render(); return; }
    try { navByApp = true; if (replace) location.replace(target); else location.hash = target; } catch { /* нижче перевіримо */ }
    if (location.hash === target) return; // адреса змінилась, далі спрацює hashchange
    navByApp = false;
    memRoute = path; // адресу змінити не можна, працюємо з пам'яті
    log('memory_routing');
  } else memRoute = path;
  render();
}
function parseHash() {
  const raw = currentPath();
  const [path, qs] = raw.split('?');
  for (const [name, re] of ROUTES) { const m = path.match(re); if (m) return { name, param: m[1], query: new URLSearchParams(qs || '') }; }
  return { name: 'notFound', query: new URLSearchParams() };
}
function nav(path) {
  if (currentPath() === path) { render(); return; }
  setAddress(path, false);
}
function redirect(path, notice) {
  if (notice) pendingNotice = notice;
  setAddress(path, true);
}
function goBack(path) { nav(path); }
const safeNext = n => (['ask', 'cabinet', 'become-expert'].includes(n) ? n : '');

// Перемикання режиму без повторного входу. У режим фахівця сервер пускає, лише якщо в цій сесії фахівець уже входив з паролем.
async function switchRole(role, then) {
  const u = me(), other = linkedOf(u);
  if (!u || !other || u.type === role) return;
  try { applyState(await api('/api/auth/switch', { to: role })); }
  catch (e) {

  log('switch_role', role);

}

// Вбудований перегляд: iframe із sandbox без allow-forms: подія submit там не спрацьовує.
// Тому кнопки форм type="button", а Enter (і Ctrl+Enter у полі опису) обробляємо самі.
function bindSubmit(form, handler) {
  form.addEventListener('submit', e => e.preventDefault());
  form.querySelectorAll('[data-submit]').forEach(b => b.addEventListener('click', () => handler()));
  form.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const single = e.target.matches('input[type=text], input[type=email], input[type=tel], input[type=password], input[type=number], input[type=url]');
    const ctrlInTextarea = e.target.matches('textarea') && (e.ctrlKey || e.metaKey);
    if (single || ctrlInTextarea) { e.preventDefault(); handler(); }
  });
}

function codeStep(box, { email, mode, payload, after, resendIn = 60000, extraHeaders }) {
  let left = Math.ceil(resendIn / 1000), timer = null;
  box.hidden = false;
  box.innerHTML = `
    <div class="notice" role="status">Ми надіслали 6-значний код на <strong>${esc(email)}</strong>. Він діє 10 хвилин.</div>
    <label for="code">Код з листа</label>
    <input id="code" class="short" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <div id="codeErr" class="error"></div>
    <div class="actions"><button type="button" class="primary" id="codeOk">Підтвердити</button><button type="button" id="resend" disabled>Надіслати код ще раз</button></div>
    <p class="hint">Листа немає? Перевірте папку «Спам» і чи правильно вказано адресу.</p>`;
  const inp = $('#code', box), resend = $('#resend', box);
  const tick = () => {
    if (left > 0) { resend.textContent = `Надіслати код ще раз (${left} с)`; resend.disabled = true; left--; }
    else { resend.textContent = 'Надіслати код ще раз'; resend.disabled = false; clearInterval(timer); }
  };
  tick(); timer = setInterval(tick, 1000);
  inp.focus();
  const go = async () => {
    const code = inp.value.trim();
    if (!/^\d{6}$/.test(code)) { setErr('codeErr', 'Код складається з 6 цифр', inp); return fail(['code'], [inp], 'код'); }
    $('#codeOk', box).disabled = true;
    try { const st = await api('/api/auth/verify', { email, mode, code }, extraHeaders); clearInterval(timer); log('email_code_ok', mode); await after(st); }
    catch (e) { $('#codeOk', box).disabled = false; setErr('codeErr', e.error, inp); fail(['code'], [inp], 'код'); }
  };
  $('#codeOk', box).onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  resend.onclick = async () => {
    try { const r = await api('/api/auth/start', { ...(payload || {}), email, mode }, extraHeaders); left = Math.ceil((r.resendIn || 60000) / 1000); setErr('codeErr', ''); timer = setInterval(tick, 1000); tick(); log('email_code_resend'); }
    catch (e) { setErr('codeErr', e.error, inp); if (e.retryIn) { left = Math.ceil(e.retryIn / 1000); timer = setInterval(tick, 1000); tick(); } }
  };
}

    m.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => {
      flow = freshFlow(); flow.preferredExpertId = b.dataset.ask; saveFlow();
      log('home_pick_expert', b.dataset.ask); nav('/ask');
    });
  }).catch(() => { if (token === renderToken) $('#recList', m).innerHTML = '<p class="hint">Не вдалося завантажити фахівців. Оновіть сторінку.</p>'; });
};

/* ---------- Мій профіль: окрема сторінка; дані з неї автоматично підставляються в заявку ---------- */
PAGES.profile = (m, r) => {
  const next = safeNext(r.query.get('next'));
  const u = me();
  const isNew = !u;
  const nextLabel = { ask: 'Зберегти і повернутися до заявки', cabinet: 'Зберегти і відкрити кабінет', 'become-expert': 'Зберегти і продовжити' }[next];
  m.innerHTML = `
    <h2>Мій профіль</h2>
    <p class="hint">${isNew
      ? 'Розкажіть коротко про себе. Ці дані автоматично підставлятимуться в кожну заявку, тож заповнити їх треба лише один раз.'
      : 'Ці дані автоматично підставляються в кожну вашу заявку.'}</p>
    ${next === 'ask' ? '<div class="notice">Вашу заявку збережено. Після заповнення профілю ви повернетеся до неї.</div>' : ''}
    <form id="f" novalidate>
      <label for="name">Як до вас звертатися?</label>

      <input id="email" type="email" autocomplete="email" inputmode="email" value="${esc(u ? u.email : '')}">
      <p class="hint">Сюди прийдуть підтвердження бронювання, сповіщення і підсумок консультації.</p>
      <div id="emailErr" class="error"></div>
      ${u ? '<p class="hint" id="mailState">Пошту підтверджено кодом з листа ✓ Щоб змінити пошту, вкажіть нову: ми надішлемо код на неї.</p>' : ''}
      <label for="about">Чим ви займаєтесь? <span class="hint">(необов'язково)</span></label>
      <input id="about" type="text" value="${esc(u && u.about ? u.about : '')}">
      <p class="hint">Допомагає AI точніше підібрати фахівця. Фахівець побачить це разом із заявкою.</p>
      ${isNew ? '<p class="hint">Зберігаючи профіль, ви погоджуєтесь з умовами користування. Пароль не потрібен: для підтвердження і для кожного входу ми надсилаємо код на пошту.</p>' : ''}
      <div id="savedMsg" class="ok" hidden role="status">Профіль збережено ✓</div>
      <div class="actions"><button class="primary" type="button" data-submit>${nextLabel || 'Зберегти профіль'}</button></div>
    </form>
    <div id="codeBox" hidden></div>
    ${isNew ? `<p>Вже заповнювали профіль раніше? <a href="#/login?next=${next}">Увійти</a></p>` : ''}`;
  const done = () => { if (next) return nav('/' + next); render({ silent: true }); $('#savedMsg', m).hidden = false; };
  bindSubmit($('#f', m), async () => {
    const name = $('#name', m), email = $('#email', m);
    const nm = name.value.trim(), em = email.value.trim(), about = $('#about', m).value.trim();
    const errs = [], first = [];
    if (!nm) { setErr('nameErr', 'Вкажіть, як до вас звертатися', name); errs.push('name'); first.push(name); } else setErr('nameErr', '', name);
    if (!EMAIL_RE.test(em)) { setErr('emailErr', 'Перевірте адресу пошти', email); errs.push('email'); first.push(email); } else setErr('emailErr', '', email);
    if (errs.length) return fail(errs, first, 'профіль');
    const btn = m.querySelector('[data-submit]'); btn.disabled = true;
    try {
      if (!u) {
        // Новий профіль: спершу код на пошту, акаунт з'явиться після підтвердження
        const r0 = await api('/api/auth/start', { mode: 'signup', email: em, name: nm, about });
        log('profile_code_sent');
        codeStep($('#codeBox', m), { email: r0.sentTo, mode: 'signup', payload: { name: nm, about }, resendIn: r0.resendIn,
          after: st => { applyState(st); log('profile_created'); done(); } });
      } else {
        applyState(await api('/api/profile', { name: nm, about }));
        log('profile_updated');
        if (em.toLowerCase() !== u.email.toLowerCase()) {
          const r0 = await api('/api/auth/start', { mode: 'change_email', email: em });
          codeStep($('#codeBox', m), { email: r0.sentTo, mode: 'change_email', resendIn: r0.resendIn,
            after: st => { applyState(st); log('email_changed'); done(); } });
        } else done();
      }
    } catch (e) { serverErr(e, { name: 'name', email: 'email' }, 'email'); }
    finally { btn.disabled = false; }
  });
};

  m.innerHTML = `
    <h2>Вхід</h2>
    <p class="hint">Вкажіть пошту, з якою реєструвалися. Клієнт входить за кодом, який ми надішлемо на пошту. Фахівець входить з паролем.</p>
    <form id="f" novalidate>
      <fieldset class="radio-row">
        <legend>Увійти як:</legend>
        <label><input type="radio" name="loginRole" value="client" ${defRole === 'client' ? 'checked' : ''}> Клієнт</label>
        <label><input type="radio" name="loginRole" value="expert" ${defRole === 'expert' ? 'checked' : ''}> Фахівець</label>
      </fieldset>
      <label for="email">Електронна пошта</label>
      <input id="email" type="email" autocomplete="email" value="${esc(r.query.get('email') || '')}">
      <div id="emailErr" class="error"></div>
      <div id="passBox" ${defRole === 'expert' ? '' : 'hidden'}>
        <label for="pass">Пароль фахівця</label>
        <input id="pass" type="password" autocomplete="current-password">
        <div id="passErr" class="error"></div>
      </div>
      <div class="actions"><button class="primary" type="button" data-submit>Увійти</button></div>
    </form>
    <div id="codeBox" hidden></div>
    <p>Ще не заповнювали профіль? <a href="#/profile?next=${next}">Заповнити профіль</a> або <a href="#/become-expert">стати фахівцем</a>.</p>`;

  const passBox = $('#passBox', m);
  m.querySelectorAll('input[name=loginRole]').forEach(radio => {
    radio.onchange = () => {
      passBox.hidden = radio.value !== 'expert' || !radio.checked;
      setErr('passErr', '');
    };
  });

  bindSubmit($('#f', m), async () => {
    const email = $('#email', m);
    const pass = $('#pass', m);
    const role = (m.querySelector('input[name=loginRole]:checked') || {}).value || 'client';
    const em = email.value.trim().toLowerCase();
    setErr('emailErr', '', email);
    setErr('passErr', '', pass);
    if (!em) { setErr('emailErr', 'Вкажіть адресу пошти', email); return fail(['email'], [email], 'вхід'); }
    const btn = m.querySelector('[data-submit]'); btn.disabled = true;
    try {
      if (role === 'expert') {
        if (!pass.value) { setErr('passErr', 'Введіть пароль фахівця', pass); return fail(['pass'], [pass], 'вхід'); }
        applyState(await api('/api/auth/expert-login', { email: em, pass: pass.value }));
        flow = freshFlow(); log('login', 'expert'); nav('/' + next);
      } else {
        const r0 = await api('/api/auth/start', { mode: 'login', email: em });
        codeStep($('#codeBox', m), { email: r0.sentTo, mode: 'login', resendIn: r0.resendIn,
          after: st => { applyState(st); flow = freshFlow(); log('login', 'client'); nav('/' + next); } });
      }
    } catch (e) { serverErr(e, { email: 'email', pass: 'pass' }, role === 'expert' ? 'pass' : 'email'); }
    finally { btn.disabled = false; }
  });
};

PAGES.ask = m => {
  const me0 = me();
  // Помилка 4: фахівець подає заявку від своєї клієнтської анкети
  const u = me0 && me0.type === 'expert' ? (linkedOf(me0) || me0) : me0;
  // Дані про людину беруться з профілю автоматично
  const who = u
    ? `<div class="card" id="whoCard"><div class="row"><span><strong>Заявка від:</strong> ${esc(u.name)}</span><a href="#/profile">Змінити профіль</a></div>
        <p class="hint" style="margin:0">${esc(u.email)}${u.about ? ' · ' + esc(u.about) : ''}</p>
        ${me0.type === 'expert' ? '<p class="hint" style="margin:4px 0 0">Ви в режимі фахівця. Заявка піде від вашої анкети клієнта, і ви перейдете в режим клієнта. Повернутися можна в меню.</p>' : ''}</div>`
    : '';
  m.innerHTML = `
    <h2>Опишіть своє питання</h2>
    ${who}
    ${(pe => pe ? `<div class="notice">Ви обрали фахівця: <strong>${esc(pe.name)}</strong>. Він буде першим у добірці, а AI покаже й інших, якщо тема питання інша. <a href="#/ask" id="unpick">Скасувати вибір</a></div>` : '')(flow.preferredExpertId && findExpert(flow.preferredExpertId))}
    <p class="hint">Своїми словами: що сталося і яку відповідь хочете отримати після розмови. Якщо це важливо, напишіть, коли потрібна консультація і який у вас бюджет.</p>
    <form id="f" novalidate>
      <label for="text">Ваше питання</label>
      <textarea id="text" maxlength="2000" rows="7">${esc(flow.draft != null ? flow.draft : fullText())}</textarea>
      <div class="row"><span id="textErr" class="error"></span><span class="hint" id="count"></span></div>
      <p class="hint">Опис побачить лише фахівець, якого ви оберете.</p>
      <div id="profileErr" class="error" role="alert"></div>
      <div class="actions"><button class="primary" type="button" data-submit>Знайти фахівця</button></div>
    </form>`;
  const form = $('#f', m), ta = $('#text', m), count = $('#count', m);
  if ($('#unpick', m)) $('#unpick', m).onclick = e => { e.preventDefault(); flow.preferredExpertId = null; saveFlow(); render({ silent: true }); };
  const MIN = 30;
  const upd = () => { const n = noEmoji(ta.value).length; count.textContent = n < MIN ? `${n} / ще ${MIN - n} симв.` : `${n} симв. ✓`; };
  upd();
  // Чернетка зберігається, щоб після заповнення профілю текст не загубився
  ta.addEventListener('input', () => { upd(); flow.draft = ta.value; saveFlow(); });
  bindSubmit(form, async () => {
    const v = ta.value.trim();
    if (noEmoji(v).length < MIN) { setErr('textErr', `Опишіть трохи детальніше: щонайменше ${MIN} символів`, ta); return fail(['text'], [ta], 'опис'); }
    if (realWords(v).length < 4) { setErr('textErr', 'Опишіть питання словами: що сталося і що хочете дізнатися', ta); return fail(['text_words'], [ta], 'опис'); }
    setErr('textErr', '', ta);
    // Без профілю заявку не приймаємо: показуємо помилку з посиланням на профіль
    if (!me()) {
      flow.draft = ta.value;
      $('#profileErr', m).innerHTML = 'Ми не знаємо хто ви, <a href="#/profile?next=ask" id="profileLink">заповніть свій профіль</a>';
      return fail(['no_profile'], [$('#profileLink', m)], 'заявка');
    }
    $('#profileErr', m).textContent = '';
    const cur = me();
    if (cur.type === 'expert' && linkedOf(cur)) {
      try { applyState(await api('/api/auth/switch', { to: 'client' })); log('switch_role', 'client'); }
      catch (e) { setErr('textErr', e.error, ta); return fail(['switch'], [ta], 'заявка'); }
    }
    if (v !== fullText()) { const ui = flow.ui, pref = flow.preferredExpertId; flow = freshFlow(); flow.ui = ui; flow.preferredExpertId = pref; flow.text = v; }
    flow.draft = null;
    nav('/analysis');
  });
};

PAGES.analysis = m => {
  if (!me() || !flow.text) return redirect('/ask');
  const key = fullText() + '|' + flow.excluded.join(',');
  if (flow.analysis && flow.analysisKey === key) return showAnalysis(m);
  m.innerHTML = `<h2>Аналізуємо запит</h2><p role="status"><span class="spinner" aria-hidden="true"></span>AI читає ваш опис і шукає відповідних фахівців…</p>`;
  const token = renderToken;
  api('/api/analyze', { text: fullText(), excluded: flow.excluded }).then(a => {
    if (token !== renderToken) return; // користувач уже пішов з екрана
    flow.analysis = a;
    flow.analysisKey = key;
    flow.clarifyMode = null;
    saveFlow();
    log('ai_analysis', `тема=${a.primary || 'немає'}${a.secondary ? '+' + a.secondary : ''}, впевненість ${a.confidence}%, коли=${a.urgency || 'немає'}, бюджет=${a.budget || 'немає'}${a.sensitive ? ', чутлива тема' : ''}`);
    showAnalysis(m);
    const h = m.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus(); }
  }).catch(e => {
    if (token !== renderToken) return;
    // Помилка AI чи сервера не ламає сторінку: пояснюємо і даємо повторити
    m.innerHTML = `<h2>Не вдалося проаналізувати запит</h2><div class="warn">${esc(e.error)}</div>
      <div class="actions"><button id="edit">Змінити опис</button><button class="primary" id="again">Спробувати ще раз</button></div>`;
    $('#edit', m).onclick = () => goBack('/ask');
    $('#again', m).onclick = () => render({ silent: true });
  });
};

function showAnalysis(m) {
  const a = flow.analysis;

  // 1. Чутлива тема (медицина/психологія): не консультуємо в першій версії
  if (a.sensitive && !flow.override) {
    log('sensitive_blocked');
    m.innerHTML = `
      <h2>Цю тему поки не консультуємо</h2>
      <div class="warn">AI помітив, що питання може стосуватися здоров'я або психологічного стану. На першому етапі таких консультацій немає: там інша відповідальність. Будь ласка, зверніться до лікаря або психолога напряму.</div>
      <div class="actions"><button id="edit">Змінити опис</button><button id="override">Питання не медичне, продовжити</button></div>`;
    $('#edit', m).onclick = () => goBack('/ask');
    $('#override', m).onclick = () => { flow.override = true; log('not_medical_override'); showAnalysis(m); };
    return;
  }

  // 2. AI не впевнений або користувач сказав, що AI помилився: уточнювальне питання (вільний текст)
  if (!a.primary || flow.clarifyMode) {
    const wrong = flow.clarifyMode === 'wrong';
    const cands = wrong ? [] : (a.candidates || []).filter(c => c.p >= 10);
    const msg = wrong
      ? 'Вибачте, що не влучив. Розкажіть, будь ласка, своїми словами, до якої сфери належить питання і хто, на вашу думку, міг би допомогти.'
      : a.offTopic && !cands.length
        ? `Схоже, це питання не з тих тем, з якими ми працюємо: ${CATEGORIES.map(c => c.name.toLowerCase()).join(', ')}. Якщо ми помиляємось, розкажіть детальніше, що сталося і яку відповідь ви хочете отримати.`
        : cands.length >= 2
          ? 'Я бачу кілька можливих тем. Оберіть, яка ближча, або розкажіть детальніше.'
          : 'Я не впевнений, до якого фахівця вас направити. Розкажіть, будь ласка, детальніше: що саме сталося, у якій сфері це питання і яку відповідь ви хочете отримати?';
    m.innerHTML = `
      <h2>Потрібно трохи більше деталей</h2>
      <div class="card"><p style="margin:0"><strong>AI:</strong> ${msg}</p>
        ${cands.length ? `<div class="actions" id="cands">${cands.map(c => `<button type="button" class="small" data-cand="${c.cat}">${esc(c.name)}</button>`).join('')}</div>` : ''}</div>
      <form id="cf" novalidate>
        <label for="clar">Ваше уточнення</label>
        <textarea id="clar" rows="4" maxlength="1000"></textarea>
        <div id="clarErr" class="error"></div>
        <div class="actions"><button type="button" id="edit">Переписати опис повністю</button><button class="primary" type="button" data-submit>Надіслати уточнення</button></div>
      </form>`;
    $('#edit', m).onclick = () => goBack('/ask');
    m.querySelectorAll('[data-cand]').forEach(b => b.onclick = () => {
      const c = cands.find(x => x.cat === b.dataset.cand);
      // Людина сама обрала тему: беремо її як основну
      Object.assign(a, { primary: c.cat, secondary: null, confidence: c.p, nearest: c.hasExperts ? [] : (a.nearest || []), chosenByUser: true });
      log('ai_topic_chosen', c.cat);
      showAnalysis(m);
    });
    bindSubmit($('#cf', m), () => {
      const ta = $('#clar', m), v = ta.value.trim();
      if (noEmoji(v).length < 10 || realWords(v).length < 2) { setErr('clarErr', 'Напишіть хоча б одне речення', ta); return fail(['clarification'], [ta], 'уточнення'); }
      if (wrong && a.primary && !a.chosenByUser) flow.excluded.push(a.primary);
      flow.clarifications.push(v);
      flow.analysis = null; flow.clarifyMode = null;
      log('ai_clarification', wrong ? 'після «AI помилився»' : 'AI не визначив тему');
      render({ silent: true });
    });
    return;
  }

  // 3. Результат: як AI зрозумів запит + підібрані фахівці
  const ranked = rankExperts(a);
  const primaryList = ranked.filter(x => x.ex.cat === a.primary);
  m.innerHTML = `
    <h2>Підібрані фахівці</h2>
    <div class="card">
      <h3 style="margin-top:0">Як AI зрозумів ваш запит</h3>
      <table>
        <tr><td>Тема</td><td>${esc(catName(a.primary))} <span class="hint">· впевненість ${a.confidence}%</span>${a.secondary ? `<br><span class="hint">Також стосується: ${esc(catName(a.secondary))}</span>` : ''}</td></tr>
        <tr><td>Головне питання</td><td>${esc(a.question)}</td></tr>
        ${a.words.length ? `<tr><td>Ключові слова</td><td>${a.words.map(esc).join(', ')}</td></tr>` : ''}
        <tr><td>Коли</td><td>${a.urgency ? URGENCY_LABEL[a.urgency] : 'Не вказано, показуємо найближчий час'}</td></tr>
        <tr><td>Бюджет</td><td>${a.budget ? `до ${a.budget} грн` : 'Не вказано'}</td></tr>
      </table>
      <div class="actions"><button class="small" id="edit">Змінити опис</button><button class="small" id="wrong">AI неправильно зрозумів тему</button></div>
    </div>
    ${primaryList.length ? '' : `
      <div class="warn" id="wait">
        Поки немає фахівців з теми «${esc(catName(a.primary))}». Ми саме шукаємо їх і можемо написати вам, щойно хтось з'явиться.
        ${(a.nearest || []).length
          ? `<p style="margin:8px 0 0">Найближче за змістом: ${a.nearest.map(n => `«${esc(n.name)}», це ${esc(n.about)}`).join('; ')}. Ваше питання AI відніс до теми «${esc(catName(a.primary))}», це ${esc(a.primaryAbout || '')}. Якщо питання все ж ближче до суміжної теми, подивіться фахівців нижче.</p>`
          : '<p style="margin:8px 0 0">Схожих тем, де фахівці вже є, теж немає. Зараз ніхто на платформі не допоможе саме з цим питанням.</p>'}
        <div class="actions" style="margin-top:8px"><button class="small" id="waitBtn" ${mySub(a.primary) ? 'disabled' : ''}>${mySub(a.primary) ? 'Ви в списку очікування ✓' : 'Повідомити мене'}</button></div>

      </div>`}
    ${ranked.length ? `
      <div>
        <label class="inline">Рівень
          <select id="lvl"><option value="">Усі</option>${Object.entries(LEVELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        </label>
        <label class="inline">Сортувати
          <select id="sort"><option value="match">Найкращий збіг</option><option value="price">Спочатку дешевші</option><option value="rating">Найвищий рейтинг</option><option value="soon">Найближчий час</option></select>
        </label>
      </div>
      ${primaryList.length ? `<p class="hint" id="subLine">${mySub(a.primary)
        ? `Ви підписані на нових фахівців з теми «${esc(catName(a.primary))}» ✓`
        : `<button class="small" id="waitBtn">Повідомляти про нових фахівців з цієї теми</button>`}</p>` : ''}
      ${!primaryList.length ? '<p class="hint">Можуть допомогти із суміжної теми:</p>' : ''}
      <div id="list"></div>` : ''}`;
  $('#edit', m).onclick = () => goBack('/ask');
  $('#wrong', m).onclick = () => { flow.clarifyMode = 'wrong'; showAnalysis(m); };
  if ($('#waitBtn', m)) $('#waitBtn', m).onclick = async () => {
    // Підписка: хто, тема, бюджет, текст заявки і момент оформлення. Відлік нових фахівців іде саме від нього (на сервері).
    try { applyState(await api('/api/subscriptions', { cat: a.primary, budget: a.budget || null, text: fullText() })); log('waitlist', a.primary); }
    catch (e) { pendingNotice = e.error; }
    showAnalysis(m);
  };
  if (!ranked.length) return;

  const ui = flow.ui;
  $('#lvl', m).value = ui.lvl; $('#sort', m).value = ui.sort;
  const draw = () => {
    let list = ranked.filter(x => !ui.lvl || x.ex.level === ui.lvl);
    const soon = x => (x.nextSlot ? x.nextSlot.at : Infinity);
    const sorters = { match: (p, q) => q.match - p.match, price: (p, q) => p.ex.price - q.ex.price, rating: (p, q) => (q.ex.rating || 0) - (p.ex.rating || 0), soon: (p, q) => soon(p) - soon(q) };
    list = [...list].sort(sorters[ui.sort]);
    $('#list', m).innerHTML = list.length
      ? list.map(x => expertCardHtml(x.ex, { match: x.match, reasons: x.reasons, button: true, nextSlot: x.nextSlot })).join('')
      : '<p>Нікого не знайдено з таким фільтром.</p>';
    $('#list', m).querySelectorAll('button[data-id]').forEach(b => b.onclick = () => {
      if (flow.expertId !== b.dataset.id) flow.slot = null;
      flow.expertId = b.dataset.id;
      log('open_expert', b.dataset.id);
      nav('/expert/' + b.dataset.id);
    });
  };
  $('#lvl', m).onchange = () => { ui.lvl = $('#lvl', m).value; log('filter_level', ui.lvl || 'all'); draw(); };
  $('#sort', m).onchange = () => { ui.sort = $('#sort', m).value; log('sort', ui.sort); draw(); };
  draw();
}

  const sc = scoreExpert(ex, flow.analysis, fullText());
  const days = slotsFor(ex);
  const reviews = ex.mock ? SAMPLE_REVIEWS[parseInt(ex.id.slice(1), 10) % SAMPLE_REVIEWS.length] : [];
  m.innerHTML = `
    <h2>${esc(ex.name)}</h2>
    <p><span class="badge">${LEVELS[ex.level]}</span><span class="badge">${ex.demo ? 'демо-профіль' : ex.test ? 'тестовий профіль' : ex.verified ? '✓ перевірено' : 'без перевірки (демо)'}</span> ${ex.rating ? `★ ${ex.rating} (${ex.reviews} відгуків)` : '<span class="hint">Новий фахівець</span>'}</p>

    <div id="slotErr" class="error"></div>
    <div class="actions"><button id="back">Назад до підбору</button><button class="primary" id="next">Продовжити</button></div>`;
  $('#back', m).onclick = () => goBack('/analysis');
  const slotBtns = [...m.querySelectorAll('.slot')];

  if (flow.slot && flow.expertId === ex.id) {

  }

  $('#next', m).onclick = () => {

    const errs = [];
    if (!rating) { setErr('rateErr', 'Поставте оцінку'); errs.push('rating'); }
    if (!res) { setErr('resErr', 'Оберіть варіант'); errs.push('resolved'); } else setErr('resErr', '');

function bookingRow(b, side) {
  const who = side === 'client' ? b.expertName : b.clientName;
  return `<div class="card" data-bid="${b.id}">
    <div class="row"><strong>${esc(who)}</strong><span>${esc(whenText(b.at))} · ${b.price} грн</span></div>
    <p style="margin:4px 0">${esc(b.request.question)}</p>`;
}
function withBadge(row, why) {
  return row.replace('<strong>', '<span><strong>').replace('</strong>', `</strong><span class="badge" data-why>${why}</span></span>`);
}
function clientCabinet(m, u) {
  const mine = db.bookings.filter(b => b.clientId === u.id).sort((x, y) => x.at - y.at);
  const now = Date.now();
  const upcoming = mine.filter(b => b.status !== 'done' && b.at > now);
  const overdue = mine.filter(b => b.status !== 'done' && b.at <= now).reverse();
  const past = mine.filter(b => b.status === 'done').reverse();
  const joinBtn = b => `
      <div class="actions" style="margin-top:6px"><button class="small" data-join="${b.id}">Приєднатися</button></div></div>`;
  m.innerHTML = `
    <h2>Мій кабінет</h2>
    ${linkedOf(u) ? '<div class="notice">Ви також фахівець. Кабінет фахівця відкривається перемикачем «Фахівець» у меню.</div>' : ''}
    <div class="card"><div class="row"><strong>${esc(u.name)}</strong><a href="#/profile">Змінити профіль</a></div><span class="hint">${esc(u.email)}${u.about ? ' · ' + esc(u.about) : ''}</span></div>
    <div class="actions"><button class="primary" id="newQ">Поставити нове питання</button></div>
    ${(db.subscriptions || []).some(x => x.userId === u.id) ? `<h3>Підписки на нових фахівців</h3>
      ${(db.subscriptions || []).filter(x => x.userId === u.id).map(x => `<div class="card sub-row"><div class="row"><span>Ви чекаєте фахівця з теми «${esc(catName(x.cat))}»</span><span class="hint">${esc(subState(x))}</span></div><p class="hint" style="margin:0">З ${esc(fmtDateTime(x.createdAt))}${x.budget ? `, бюджет до ${x.budget} грн` : ''}</p></div>`).join('')}` : ''}
    ${overdue.length ? `<h3>Потребує дії</h3>
    ${overdue.map(b => withBadge(bookingRow(b, 'client'), 'час минув') + `
      <p class="hint" style="margin:0">Консультацію не провели.</p>` + joinBtn(b)).join('')}` : ''}
    <h3>Найближчі консультації</h3>
    ${upcoming.length ? upcoming.map(b => bookingRow(b, 'client') + joinBtn(b)).join('') : '<p class="hint">Поки немає запланованих консультацій.</p>'}
    <h3>Минулі консультації</h3>
    ${past.length ? past.map(b => bookingRow(b, 'client') + `
      ${b.summaryText ? `<details><summary>Підсумок</summary><ul>${b.summaryText.split('\n').filter(Boolean).map(p => `<li>${esc(p)}</li>`).join('')}</ul></details>` : '<p class="hint">Фахівець ще готує підсумок.</p>'}
      ${b.review ? `<p class="hint">Ваша оцінка: ${'★'.repeat(b.review.rating)}</p>` : `<div class="actions" style="margin-top:6px"><button class="small" data-rate="${b.id}">Оцінити</button></div>`}
      </div>`).join('') : '<p class="hint">Тут з\'являться проведені консультації та їхні підсумки.</p>'}`;
  $('#newQ', m).onclick = () => { flow = freshFlow(); nav('/ask'); };
  m.querySelectorAll('[data-join]').forEach(b => b.onclick = () => nav('/session/' + b.dataset.join));
  m.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => nav('/summary/' + b.dataset.rate));
}
// Стан консультації для фахівця. Окремо не зберігаємо, рахуємо з часу і підсумку.
// Запис без поля стану вважаємо заброньованим.
function expertState(b) {
  if (b.status === 'done') return b.summaryText ? { tab: 'done' } : { tab: 'action', why: 'чекає підсумку' };
  return b.at > Date.now() ? { tab: 'planned' } : { tab: 'action', why: 'час минув' };
}
const XTABS = [['action', 'Потребує дії'], ['planned', 'Заплановано'], ['done', 'Завершено']];
const XEMPTY = { action: 'Нічого не чекає на вас.', planned: 'Запланованих консультацій немає.', done: 'Тут будуть консультації з підсумком.' };
const XTAB_KEY = 'micro-consult-xtab-v1';
function saveXTab(t) { try { sessionStorage.setItem(XTAB_KEY, t); } catch { /* у перегляді Claude сховища немає */ } memXTab = t; }
let memXTab = null;
function expertTab(groups) {
  let t = memXTab;
  try { t = sessionStorage.getItem(XTAB_KEY) || t; } catch { /* немає сховища */ }
  if (groups[t]) return t;
  return groups.action.length || !groups.planned.length ? 'action' : 'planned';
}
function xCard(b) {
  const st = expertState(b);
  const desc = `<details><summary>Опис від клієнта</summary><p style="white-space:pre-wrap">${esc(b.request.text)}</p></details>`;
  const head = st.why ? withBadge(bookingRow(b, 'expert'), st.why) : bookingRow(b, 'expert');
  if (st.tab === 'planned') return head + desc + `
      <p class="hint">Посилання на відеозв'язок з'явиться тут за 5 хвилин до початку.</p></div>`;
  if (st.why === 'час минув') return head + desc + `
      <p class="hint">Консультацію не провели.</p></div>`;
  return head + desc + (b.summaryText
      ? `<details><summary>Ваш підсумок</summary><p style="white-space:pre-wrap">${esc(b.summaryText)}</p></details>`
      : `<label for="sum_${b.id}">Підсумок для клієнта</label>
         <p class="hint">Кілька пунктів: що обговорили і які наступні кроки. Кожен пункт з нового рядка.</p>
         <textarea id="sum_${b.id}" rows="4"></textarea><div id="sumErr_${b.id}" class="error"></div>
         <div class="actions" style="margin-top:6px"><button class="small" data-sum="${b.id}">Надіслати підсумок</button></div>`) +
      `${b.review ? `<p class="hint">Оцінка клієнта: ${'★'.repeat(b.review.rating)}</p>` : ''}</div>`;
}
function expertCabinet(m, u) {
  const rec = myExpertRecord();
  if (!rec) { m.innerHTML = '<h2>Кабінет фахівця</h2><p>Анкету не знайдено.</p>'; return; }
  const pub = regToPublic(rec);
  const mine = db.bookings.filter(b => b.expertId === rec.id).sort((x, y) => x.at - y.at);
  const done = mine.filter(b => b.status === 'done');
  const gross = done.reduce((s, b) => s + b.price, 0);
  const groups = { action: [], planned: [], done: [] };
  mine.forEach(b => groups[expertState(b).tab].push(b));
  groups.done.reverse();
  const tab = expertTab(groups);
  m.innerHTML = `
    <h2>Кабінет фахівця</h2>
    ${linkedOf(u) ? `<div class="notice">Консультації, які ви бронюєте для себе, лежать у кабінеті клієнта. ${(n => n ? `Зараз їх ${n}. ` : '')(db.bookings.filter(b => b.clientId === linkedOf(u).id && b.status === 'booked').length)}Перемикач «Клієнт» у меню.</div>` : ''}
    ${rec.status === 'pending'
      ? '<div class="warn">Заявка на перевірці. Після схвалення профіль з\'явиться в підборі для клієнтів.</div>'
      : '<div class="ok">Профіль активний (демо): клієнти бачать вас у підборі з позначкою «без перевірки (демо)».</div>'}
    <h3>Як вас бачать клієнти</h3>
    ${expertCardHtml(pub)}
    <h3>Графік</h3>
    <p>${rec.days.map(d => WEEKDAYS[d]).join(', ')}, ${rec.from}–${rec.to} (ваш пояс, ${utcLabel(expertTz(rec))}) · ${rec.price} грн за 15 хв</p>
    <p class="hint">Час бронювань нижче показано в поясі цього пристрою, ${utcLabel(VIEW_TZ)}.</p>
    <h3>Консультації</h3>
    <div class="tabs" role="tablist" aria-label="Стан консультацій">${XTABS.map(([k, name]) => `<button type="button" class="small" role="tab" data-xtab="${k}" aria-selected="${k === tab}">${name} ${groups[k].length}</button>`).join('')}</div>
    <div role="tabpanel" id="xpanel">${groups[tab].length ? groups[tab].map(b => xCard(b)).join('') : `<p class="hint">${XEMPTY[tab]}</p>`}</div>
    <h3>Заробіток</h3>
    <table>
      <tr><td>Проведено консультацій</td><td>${done.length}</td></tr>
      <tr><td>Оплачено клієнтами</td><td>${gross} грн</td></tr>
      <tr><td>Комісія платформи (20%)</td><td>${Math.round(gross * COMMISSION)} грн</td></tr>
      <tr><td>До виплати вам</td><td><strong>${Math.round(gross * (1 - COMMISSION))} грн</strong></td></tr>
    </table>`;
  m.querySelectorAll('[data-xtab]').forEach(btn => btn.onclick = () => { saveXTab(btn.dataset.xtab); render({ silent: true }); });
  m.querySelectorAll('[data-sum]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.sum, ta = $('#sum_' + id, m), v = ta.value.trim();
    if (v.length < 20) { setErr('sumErr_' + id, 'Напишіть хоча б кілька речень', ta); return fail(['summary'], [ta], 'підсумок фахівця'); }
    btn.disabled = true;
    api(`/api/bookings/${id}/summary`, { text: v }).then(st => { applyState(st); log('expert_summary'); render({ silent: true }); })
      .catch(e => { btn.disabled = false; setErr('sumErr_' + id, e.error, ta); });
  });
}

// Освіта: назва закладу, ступінь, курси. Або абревіатура закладу великими літерами (КНУ, MBA).
const EDU_RE = /(універс|університ|інститут|академі|коледж|технікум|училищ|ліце|гімназі|школ|факультет|кафедр|бакалавр|магістр|спеціаліст|аспірант|докторант|кандидат|доктор|ступін|ступен|диплом|сертиф|курс|освіт|спеціальн|университет|институт|академи|колледж|universit|college|institut|academy|school|faculty|bachelor|master|degree|diploma|certif|course|phd|mba|bsc|msc)/u;
function eduOk(t) {
  const c = noEmoji(t);
  if (!realWords(c).length) return false;
  return EDU_RE.test(c.toLowerCase()) || /(?<!\p{L})\p{Lu}{2,6}(?!\p{L})/u.test(c);
}
// Посилання: профіль на відомій платформі або власний сайт з ім'ям чи прізвищем в адресі.
const PROFILE_HOSTS = ['linkedin.com', 'github.com', 'gitlab.com', 'behance.net', 'dribbble.com', 'facebook.com', 'instagram.com', 'x.com', 'twitter.com',
  't.me', 'youtube.com', 'tiktok.com', 'threads.net', 'medium.com', 'upwork.com', 'djinni.co', 'work.ua', 'robota.ua', 'scholar.google.com', 'orcid.org'];
const PROFILE_SUBS = ['medium.com', 'substack.com'];
const NOT_HANDLE = ['', 'search', 'explore', 'home', 'feed', 'login', 'signup', 'watch', 'results', 'jobs', 'hashtag'];
const SEARCH_HOST = /(^|\.)(google|bing|yahoo|duckduckgo|yandex|baidu|ecosia|startpage)\.[a-z.]+$/;
const TR_A = { а: 'a', б: 'b', в: 'v', г: 'h', ґ: 'g', д: 'd', е: 'e', є: 'ie', ж: 'zh', з: 'z', и: 'y', і: 'i', ї: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p',
  р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'shch', ь: '', ю: 'iu', я: 'ia', ы: 'y', э: 'e', ё: 'e', ъ: '' };
const TR_B = { ...TR_A, г: 'g', х: 'h', й: 'y', є: 'ye', ї: 'yi', ю: 'yu', я: 'ya' };
const translit = (w, tr) => [...w.toLowerCase()].map(ch => tr[ch] ?? ch).join('').replace(/[^a-z]/g, '');
function nameInHost(host, name) {
  const h = host.replace(/[^a-z]/g, '');
  return String(name).split(/[\s'’ʼ-]+/).some(part => [TR_A, TR_B].some(tr => {
    const l = translit(part, tr);
    return l.length >= 4 && h.includes(l.slice(0, 6));
  }));
}
function linkProblem(link, name) {
  if (!/^https?:\/\/[^\s.]+\.\S+$/i.test(link)) return 'Посилання має починатися з http:// або https://';
  let u; try { u = new URL(link); } catch { return 'Посилання має починатися з http:// або https://'; }
  const host = u.hostname.toLowerCase().replace(/^(www|m)\./, '');
  const segs = u.pathname.split('/').filter(Boolean).map(x => x.toLowerCase());
  if (PROFILE_HOSTS.includes(host)) {
    if (host === 'linkedin.com' ? ['in', 'company', 'pub'].includes(segs[0]) && segs[1] : !NOT_HANDLE.includes(segs[0] || '') || (host === 'scholar.google.com' && u.searchParams.get('user'))) return null;
  } else if (PROFILE_SUBS.some(p => host.endsWith('.' + p))) return null;
  if (SEARCH_HOST.test(host) || segs[0] === 'search') return 'Це посилання на пошук. Потрібен ваш профіль або сайт.';
  if (!PROFILE_HOSTS.includes(host) && nameInHost(host, name)) return null;
  return 'Це не схоже на ваш профіль чи сайт';
}

PAGES.becomeExpert = m => {
  const u = me();

    m.innerHTML = `<h2>Ви вже зареєстровані як фахівець</h2><p>Кабінет фахівця відкривається перемикачем «Фахівець» у меню.</p><div class="actions"><button class="primary" id="cab">Відкрити кабінет ↗</button></div>`;

function renderWizard(m) {
  const d = db.expertDraft, step = d.step;
  m.innerHTML = `
    <h2>Реєстрація фахівця</h2>
    <p class="hint">У демо заявку схвалюють одразу, і профіль отримує позначку «без перевірки (демо)». У робочій версії кожну заявку перевірятиме модератор. Займе 5–7 хвилин, чернетка зберігається автоматично.</p>
    <ol class="wsteps">${EXPERT_STEPS.map((s, i) => `<li class="${i + 1 < step ? 'done' : i + 1 === step ? 'current' : ''}" ${i + 1 === step ? 'aria-current="step"' : ''}>${i + 1}. ${s}</li>`).join('')}</ol>
    <h3>Крок ${step} з ${EXPERT_STEPS.length}: ${EXPERT_STEPS[step - 1]}</h3>
    <form id="wf" novalidate>
      ${WIZ[step].html(d)}
      <div class="actions">
        ${step > 1 ? '<button type="button" id="wBack">Назад</button>' : ''}
        <button type="button" class="primary" data-submit>${step < EXPERT_STEPS.length ? 'Далі' : 'Надіслати заявку'}</button>
      </div>
    </form>`;
  const form = $('#wf', m);
  if (WIZ[step].bind) WIZ[step].bind(m, d);
  bindSubmit(form, async () => {
    const btn = form.querySelector('[data-submit]'); btn.disabled = true;
    let res;
    try { res = await WIZ[step].validate(m, d); } finally { btn.disabled = false; } // збирає значення в чернетку і повертає [помилки, поля]
    commit();
    if (res.waiting) return; // чекаємо код з листа
    if (res.errs.length) {
      return fail(res.errs, res.first, `фахівець, крок ${step}`);
    }
    if (step < EXPERT_STEPS.length) {
      d.step++; commit();
      renderWizard(m);
      const h = m.querySelector('h3'); if (h) { h.tabIndex = -1; h.focus(); }
    } else submitExpert(d, m);
  });
  if ($('#wBack', m)) $('#wBack', m).onclick = () => {
    if (WIZ[step].collect) WIZ[step].collect(m, d);
    d.step--; commit();
    renderWizard(m);
  };
}

const val = (m, id) => ($('#' + id, m) ? $('#' + id, m).value.trim() : '');
function check(cond, id, msg, m, res, field) {

      <label for="w_id">Документ, що посвідчує особу</label>
      <p class="hint">Потрібен лише для перевірки. Клієнти його не бачать.</p>
      <input id="w_id" type="file" accept=".pdf,.jpg,.jpeg,.png">
      <ul class="files" id="w_idList"></ul><div id="w_idErr" class="error"></div>
      <label for="w_link">Профіль або портфоліо <span class="hint">(необов'язково)</span></label>
      <p class="hint">Профіль у LinkedIn, GitHub, Behance, соцмережі чи Telegram, або ваш сайт з ім'ям чи прізвищем в адресі.</p>
      <input id="w_link" type="url" value="${esc(d.link)}"><div id="w_linkErr" class="error"></div>
      <p class="hint">Кожен файл одразу перевіряється на сервері: чи це справді документ, чи читається текст. Документ, що посвідчує особу, після перевірки не зберігається.</p>`,
    bind(m, d) {
      const item = (f, icon, rm) => `<li>${icon} ${esc(f.name)} <span class="hint">${fileSize(f.size)}</span>
        ${f.checking ? '<span class="hint">перевіряємо…</span>' : f.ok ? '<span class="hint">✓ перевірено</span>' : `<span class="error" style="display:inline">${esc((f.problems || []).join(' '))}</span>`}
        ${f.checking ? '' : `<button type="button" class="small" ${rm}>Прибрати</button>`}</li>`;
      const draw = () => {
        $('#w_qualList', m).innerHTML = d.qualFiles.map((f, i) => item(f, '📄', `data-rmq="${i}"`)).join('');
        $('#w_idList', m).innerHTML = d.idFile ? item(d.idFile, '🪪', 'data-rmid') : '';
        m.querySelectorAll('[data-rmq]').forEach(b => b.onclick = () => { d.qualFiles.splice(+b.dataset.rmq, 1); commit(); draw(); });
        const rid = m.querySelector('[data-rmid]'); if (rid) rid.onclick = () => { d.idFile = null; commit(); draw(); };
      };
      const okType = f => /\.(pdf|jpe?g|png)$/i.test(f.name);
      // Файл іде на сервер тілом запиту. Сервер перевіряє вміст і повертає результат.
      const upload = async (f, kind, slot) => {
        slot.checking = true; draw();
        try {
          const r = await fetch('/api/documents?kind=' + kind, { method: 'POST', credentials: 'same-origin', body: f,
            headers: { 'X-Requested-With': 'mc', 'Content-Type': 'application/octet-stream', 'X-Proof': d.proof || '', 'X-File-Name': encodeURIComponent(f.name), 'X-Person': encodeURIComponent(d.name) } });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) Object.assign(slot, { ok: false, problems: [j.error || 'Не вдалося перевірити файл'] });
          else Object.assign(slot, { id: j.id, ok: j.ok, problems: j.problems });
        } catch { Object.assign(slot, { ok: false, problems: ["Немає зв'язку з сервером"] }); }
        slot.checking = false; log('doc_checked', `${kind}: ${slot.ok ? 'ok' : 'відхилено'}`); commit(); draw();
      };
      $('#w_qual', m).onchange = e => {
        const bad = [];
        for (const f of e.target.files) {
          if (!okType(f)) bad.push(`${f.name}: непідтримуваний формат`);
          else if (f.size > MAX_FILE) bad.push(`${f.name}: більше 10 МБ`);
          else if (!d.qualFiles.some(x => x.name === f.name)) { const slot = { name: f.name, size: f.size }; d.qualFiles.push(slot); upload(f, 'qual', slot); }
        }
        setErr('w_qualErr', bad.join('; '));
        e.target.value = ''; commit(); draw();
      };
      $('#w_id', m).onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        if (!okType(f) || f.size > MAX_FILE) { setErr('w_idErr', !okType(f) ? 'Непідтримуваний формат' : 'Файл більший за 10 МБ'); }
        else { d.idFile = { name: f.name, size: f.size }; setErr('w_idErr', ''); upload(f, 'id', d.idFile); }
        e.target.value = ''; commit(); draw();
      };
      draw();
    },
    collect(m, d) { d.education = val(m, 'w_edu'); d.link = val(m, 'w_link'); },
    validate(m, d) {
      this.collect(m, d);
      const res = { errs: [], first: [] };
      check(d.education.length >= 3 && eduOk(d.education), 'w_edu', d.education.length ? 'Не схоже на освіту. Приклад: «КНЕУ, магістр економіки»' : 'Вкажіть освіту', m, res);
      const checking = d.qualFiles.some(f => f.checking) || (d.idFile && d.idFile.checking);
      check(d.qualFiles.length > 0 && (checking || d.qualFiles.some(f => f.ok)), 'w_qual', d.qualFiles.length ? 'Жоден документ про кваліфікацію не пройшов перевірку. Завантажте інший файл.' : 'Додайте хоча б один документ про кваліфікацію', m, res);
      check(!!d.idFile && (d.idFile.checking || d.idFile.ok), 'w_id', d.idFile ? 'Документ не пройшов перевірку. Завантажте інший файл.' : 'Додайте документ, що посвідчує особу', m, res);
      if (checking && !res.errs.length) { setErr('w_qualErr', 'Зачекайте, файли ще перевіряються', $('#w_qual', m)); res.errs.push('w_qual'); res.first.push($('#w_qual', m)); }
      const lp = d.link ? linkProblem(d.link, d.name) : null;
      check(!lp, 'w_link', lp || '', m, res);
      return res;
    },
  },
  4: {
    html: d => {
      const level = levelFor(d.years), [lo, hi] = LEVEL_PRICE[level];
      return `
      <div class="card">Попередній рівень: <strong>${LEVELS[level]}</strong> (досвід ${esc(d.years)} р.). Остаточно рівень підтверджується після перевірки.</div>
      <label for="w_price">Ціна консультації 15 хвилин, грн</label>
      <p class="hint">Рекомендований діапазон для вашого рівня: ${lo}–${hi} грн. Ціну встановлюєте ви. Комісія платформи 20%, ви отримаєте <strong id="w_net">вкажіть ціну</strong>.</p>
      <input id="w_price" class="short" type="number" min="50" max="5000" step="10" inputmode="numeric" value="${esc(d.price)}">
      <div id="w_priceWarn" class="warn" hidden></div><div id="w_priceErr" class="error"></div>
      <fieldset><legend>Дні, коли ви приймаєте</legend>
        <div class="radio-row">${WEEKDAYS.map((w, i) => `<label><input type="checkbox" name="w_day" value="${i}" ${d.days.includes(i) ? 'checked' : ''}> ${w}</label>`).join('')}</div>
      </fieldset><div id="w_daysErr" class="error"></div>
      <div class="row" style="justify-content:flex-start;gap:16px">
        <div><label for="w_from">З</label><input id="w_from" class="short" type="time" step="900" value="${esc(d.from)}"></div>
        <div><label for="w_to">До</label><input id="w_to" class="short" type="time" step="900" value="${esc(d.to)}"></div>
      </div><div id="w_timeErr" class="error"></div>
      <p class="hint">Вказуйте час у вашому часовому поясі, ${utcLabel(VIEW_TZ)}. Клієнти бачитимуть вільні слоти щогодини, кожен у своєму часі.</p>`;
    },
    bind(m, d) {
      const [lo, hi] = LEVEL_PRICE[levelFor(d.years)];
      const inp = $('#w_price', m), warn = $('#w_priceWarn', m), net = $('#w_net', m);
      const upd = () => {
        const p = Number(inp.value);
        net.textContent = p > 0 ? `${Math.round(p * (1 - COMMISSION))} грн` : 'вкажіть ціну';
        const out = p > 0 && (p < lo || p > hi);
        warn.hidden = !out;
        if (out) warn.textContent = p < lo ? 'Ціна нижча за рекомендовану. Можна, але дохід буде меншим.' : 'Ціна вища за рекомендовану. Клієнти можуть рідше вас обирати, поки немає відгуків.';
      };
      upd(); inp.addEventListener('input', upd);
    },
    collect(m, d) {
      d.price = val(m, 'w_price');
      d.days = [...m.querySelectorAll('input[name=w_day]:checked')].map(x => +x.value);
      d.from = val(m, 'w_from'); d.to = val(m, 'w_to');
    },
    validate(m, d) {
      this.collect(m, d);
      const res = { errs: [], first: [] };
      const p = Number(d.price);
      check(Number.isInteger(p) && p >= 50 && p <= 5000, 'w_price', 'Вкажіть ціну цілим числом від 50 до 5000 грн', m, res);
      check(d.days.length > 0, 'w_days', 'Оберіть хоча б один день', m, res, m.querySelector('input[name=w_day]'));
      const okTime = d.from && d.to && toMin(d.to) - toMin(d.from) >= 60;
      check(okTime, 'w_time', 'Проміжок має бути щонайменше годину, і «до» пізніше за «з»', m, res, $('#w_from', m));
      return res;
    },
  },
  5: {
    html: d => {
      const preview = regToPublic({ ...d, id: 'preview', level: levelFor(d.years), price: Number(d.price), status: 'auto_approved' });
      return `
      <p>Так вас бачитимуть клієнти в підборі:</p>
      ${expertCardHtml(preview)}
      <fieldset class="radio-col"><legend>Умови</legend>
        <label><input type="checkbox" id="a_terms"> Погоджуюсь з умовами для фахівців</label>
        <label><input type="checkbox" id="a_fee"> Розумію, що платформа утримує 20% з кожної консультації</label>
        <label><input type="checkbox" id="a_sens"> Не надаватиму медичних і психологічних консультацій</label>
        <label><input type="checkbox" id="a_verify"> Даю згоду на перевірку документів і обробку персональних даних</label>
      </fieldset>
      <a href="#" id="w_terms" aria-expanded="false">Прочитати умови для фахівців</a>
      <div id="w_termsText" class="card hint" hidden>Фахівець відповідає за зміст консультації і не домовляється з клієнтами про оплату поза платформою. Платформа утримує 20% комісії та виплачує решту щотижня. Порушення правил може призвести до блокування профілю.</div>
      <div id="a_err" class="error"></div>
      <p class="hint">Реквізити для виплат додасте в кабінеті після схвалення заявки.</p>`;
    },
    bind(m) {
      $('#w_terms', m).onclick = e => {
        e.preventDefault();
        const box = $('#w_termsText', m); box.hidden = !box.hidden;
        e.target.setAttribute('aria-expanded', String(!box.hidden));
        if (!box.hidden) log('open_expert_terms');
      };
    },
    validate(m) {
      const res = { errs: [], first: [] };
      const boxes = ['a_terms', 'a_fee', 'a_sens', 'a_verify'].map(id => $('#' + id, m));
      const missing = boxes.filter(b => !b.checked);
      $('#a_err', m).textContent = missing.length ? 'Щоб надіслати заявку, позначте всі умови' : '';
      missing.forEach(b => { res.errs.push(b.id); res.first.push(b); });
      return res;
    },
  },
};

async function submitExpert(d, m) {
  const btn = m.querySelector('[data-submit]'); btn.disabled = true;
  try {
    const st = await api('/api/experts', {
      proof: d.proof, name: d.name, phone: d.phone, pass: d.pass, about: d.about, position: d.position, years: Number(d.years),
      education: d.education, link: d.link, qualIds: d.qualFiles.filter(f => f.ok).map(f => f.id), idId: d.idFile && d.idFile.id,
      price: Number(d.price), days: d.days, from: d.from, to: d.to, tz: VIEW_TZ, agree: true,
    });
    db.expertDraft = null; commit();
    applyState(st);
    log('expert_registered');
    nav('/expert-sent');
  } catch (e) {
    btn.disabled = false;
    // Сервер повертає крок і поле першої помилки: ведемо людину туди
    const first = (e.errors && e.errors[0]) || { step: e.step || d.step, field: null, msg: e.error };
    if (first.step && first.step !== d.step) { d.step = first.step; if (first.step === 1) d.passOk = false; commit(); renderWizard(m); }
    const f = first.field && $('#' + first.field, m);
    if (f) setErr(first.field + 'Err', first.msg, f); else pendingNotice = first.msg;
    if (!f) render({ silent: true });
    fail([first.field || 'server'], [f], 'реєстрація');
  }
}

PAGES.expertSent = m => {
  const rec = myExpertRecord();
  if (!rec) return redirect('/become-expert');
  m.innerHTML = `
    <h2>Заявку надіслано ✓</h2>
    <p>Дякуємо, ${esc(rec.name.split(/\s+/)[1] || rec.name)}! Що далі:</p>
    <ol class="how">
      <li>Документи пройшли автоматичну перевірку: це справді документи і текст читається. Справжність перевіряє модератор, а в демо-версії модератора ще немає, тож заявку схвалено автоматично.</li>
      <li>Ваш профіль уже з'явився в підборі для клієнтів з теми «${esc(catName(rec.cat))}» з позначкою «без перевірки (демо)».</li>
      <li>Бронювання і заробіток ви бачите в кабінеті.</li>
    </ol>
    <div class="actions"><button class="primary" id="cab">Відкрити кабінет ↗</button><button id="home">На головну</button></div>`;
  $('#cab', m).onclick = openCabinet;
  $('#home', m).onclick = () => nav('/');
};

PAGES.notFound = m => {
  m.innerHTML = `<h2>Сторінку не знайдено</h2><p>Можливо, посилання застаріло або ви увійшли під іншим акаунтом.</p><div class="actions"><button class="primary" id="home">На головну</button></div>`;
  $('#home', m).onclick = () => nav('/');
};

// Усі внутрішні посилання ведемо через nav(): так вони працюють і з маршрутом у пам'яті
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a && !a.hasAttribute('data-newtab') && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    nav(a.getAttribute('href').slice(1));
  }
}, false);

// Синхронізація між вкладками: бронювання з основної вкладки одразу видно в кабінеті
window.addEventListener('focus', async () => {
  try { await loadState(); } catch { return; }
  renderNav();
  const ae = document.activeElement;
  const typing = ae && $('#main').contains(ae) && ae.matches('input, textarea, select');
  if (['cabinet', 'home', 'mail'].includes(current) && !typing) render({ silent: true });
});

/* ===================== Email-сповіщення (ТЗ Дениса, 02.11) =====================
   Розсилку робить сервер (server/lib/notify.js) щохвилини і після кожної дії. Тут лише показ листів. */
const DAY = 86400000;
const CONSULT_STATUS = { action: 'Потребує дії', planned: 'Заплановано', done: 'Завершено' };
const lastMailAt = email => (db.outbox || []).filter(mm => mm.email.toLowerCase() === email.toLowerCase()).reduce((mx, mm) => Math.max(mx, mm.sentAt), 0);
// Листи і підписки людини: клієнт і фахівець з однією поштою бачать спільну скриньку
const myMail = u => (db.outbox || []).filter(mm => mm.email.toLowerCase() === u.email.toLowerCase()).sort((a, b) => b.sentAt - a.sentAt);
const fmtDateTime = ms => `${new Date(ms).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })}, ${hhmm(ms)}`;
function subState(sb) {
  const pref = `expert:${sb.id}:`;
  if ((db.outbox || []).some(mm => mm.keys.some(k => k.startsWith(pref)))) return 'Лист надіслано';
  if ((db.mailEvents || []).some(e => e.key.startsWith(pref))) return 'Знайдено фахівця, лист у черзі';
  return 'Чекає';
}

PAGES.mail = m => {
  const u = me();
  if (!u) return redirect('/login', 'Увійдіть, щоб побачити свою пошту.');
  const letters = myMail(u);
  const pending = (db.mailEvents || []).filter(e => { const x = db.users.find(y => y.id === e.userId); return x && x.email.toLowerCase() === u.email.toLowerCase(); });
  const last = lastMailAt(u.email);
  const itemHtml = it => it.type === 'expert'
    ? `<li>Новий фахівець: <strong>${esc(it.expertName)}</strong>, тема «${esc(catName(it.cat))}», ${it.price} грн за 15 хв. <a href="#/sub/${it.subId}">Подивитись у добірці</a></li>`
    : `<li>Консультація з фахівцем <strong>${esc(it.expertName)}</strong>: статус «${CONSULT_STATUS[it.status]}»${it.at ? `, ${esc(whenText(it.at))} (${utcLabel(VIEW_TZ)})` : ''}. <a href="#/consult/${it.bookingId}">Сторінка консультації</a></li>`;
  m.innerHTML = `
    <h2>Пошта</h2>
    <p class="hint">${db.server.mail === 'gmail' ? `Листи надсилаються на ${esc(u.email)}. Тут їхні копії.`
      : db.server.mail === 'off' ? 'Відправку листів на сервері ще не налаштовано, тому листи поки не надсилаються. Події чекають у черзі.'
      : 'Сервер у режимі розробки: листи записуються, але не надсилаються.'}</p>
    ${pending.length ? `<p class="hint">Подій у черзі: ${pending.length}.${last && Date.now() - last < DAY ? ` Наступний лист не раніше ${esc(fmtDateTime(last + DAY))}: не більше одного листа на добу.` : ''}</p>` : ''}
    ${letters.length ? letters.map(mm => `<div class="card mail" data-mail="${mm.id}">
        <div class="row"><strong>${esc(mm.subject)}</strong><span class="hint">${esc(fmtDateTime(mm.sentAt))}</span></div>
        <p class="hint" style="margin:2px 0">Кому: ${esc(mm.email)}</p>
        <ul>${mm.items.map(itemHtml).join('')}</ul></div>`).join('') : '<p class="hint">Листів поки немає.</p>'}`;
};
// Посилання з листа: сторінка консультації
PAGES.consult = (m, r) => {
  const b = myBooking(r.param);
  if (!b) return PAGES.notFound(m);
  redirect((b.status === 'done' ? '/summary/' : '/booked/') + b.id);
};
// Посилання з листа: добірка за підпискою
PAGES.sub = (m, r) => {
  const u = me(), sb = (db.subscriptions || []).find(x => x.id === r.param);
  if (!u || !sb || (sb.userId !== u.id && sb.userId !== u.clientId)) return PAGES.notFound(m);
  if (sb.userId !== u.id) { switchRole('client', null).then(() => { flow = freshFlow(); flow.text = sb.text; redirect('/analysis'); }); return; }
  flow = freshFlow(); flow.text = sb.text;
  redirect('/analysis');
};
// Раз на хвилину підтягуємо свіжі дані: нові листи, стани консультацій
setInterval(async () => {
  try { await loadState(); } catch { return; }
  if (current === 'mail') render({ silent: true }); else renderNav();
}, 60000);

// Старт: спершу дані з сервера, потім сторінка
// Заявка з вкладки відновлюється лише тепер, коли сервер сказав, хто увійшов (помилка 5)
loadState().then(() => { flow = loadFlow() || flow; }).catch(() => { serverOK = false; showStorageWarn(); }).finally(() => render());
</script>
</body>
</html>
